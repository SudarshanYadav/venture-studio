<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100" role="img" aria-labelledby="t">
  <title id="t">Mrudu wordmark (placeholder name)</title>
  <!-- Placeholder brand name. To swap the name, edit the one <text> element below.
       Once the name is final and trademark-cleared, convert the text to outlines so it renders
       the same without the font installed. Font: Bricolage Grotesque 700 (SIL OFL 1.1). -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;display=swap');
    .wm{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:700;font-size:64px;letter-spacing:-2.5px}
  </style>
  <!-- Mark: a hardness test strip with two pads (hard magenta, soft green). Brand device only, not a reading. -->
  <rect x="10" y="12" width="28" height="76" rx="6" fill="#FFFFFF" stroke="#14232E" stroke-width="3"/>
  <rect x="16" y="20" width="16" height="16" rx="2.5" fill="#B4346C"/>
  <rect x="16" y="42" width="16" height="16" rx="2.5" fill="#2F8F6B"/>
  <text class="wm" x="54" y="72" fill="#14232E">mrudu</text>
</svg>
